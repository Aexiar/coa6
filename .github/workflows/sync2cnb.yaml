name: sync2cnb.yaml
# 在 main 分支发生 push 事件时触发。
on:
  push:
    branches:
      - main
      - master
    paths:
      #      - "docs/**" # 只当 docs 文件夹中的文件发生变化时触发
      - "**/**" # 只当 docs 文件夹中的文件发生变化时触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "Sync to CNB Repository"
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL=${{ secrets.GIT_REPO }} \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME=${{ secrets.GIT_USERNAME }} \
            -e PLUGIN_PASSWORD=${{ secrets.GIT_PASSWORD }} \
            -e PLUGIN_FORCE="true" \
            tencentcom/git-sync